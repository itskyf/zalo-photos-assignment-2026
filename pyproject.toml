[project]
name = "z-photos"
version = "0.1.0"
description = "Zalo Photos Assignment 2026"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Kỳ", email = "40734986+itskyf@users.noreply.github.com" }]
dependencies = [
  "accelerate~=1.13",
  "dagshub~=0.6",
  "datasets~=4.7",
  "fiftyone~=1.13",
  "mlflow~=3.10",
  "open-clip-torch~=3.3",
  "torch~=2.10",
  "torch-uncertainty~=0.10",
  "torchmetrics~=1.9",
  "torchvision>=0.25.0",
  "transformers~=5.3",
  "umap-learn~=0.5",
]

[dependency-groups]
dev = [
  "catppuccin-jupyterlab~=0.2",
  "datalayer-pycrdt~=0.12",
  "ipykernel~=7.2",
  "ipywidgets~=8.1",
  "jupyter-collaboration~=4.2",
  "jupyter-mcp-server~=0.22",
  "jupyterlab~=4.5",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.uv]
override-dependencies = ["sse-starlette~=1.6"]
